name: Bump nexus-shell cask

# Bumps the cask when the website publishes a new release manifest.
#
# Pull, not push: the website repo is private, so having it push here would mean
# a cross-repo PAT. Polling needs nothing but the default token, and a missed
# run heals itself on the next tick.
#
# ---------------------------------------------------------------------------
# Which hosts this job may talk to — measured from a runner, not assumed:
#
#   nexusshell.app                403    Cloudflare bot protection rejects
#   releases.nexusshell.app       403    GitHub's datacenter IPs across the
#   updates.nexusshell.app        403    whole zone. Not a User-Agent problem:
#                                        the same curl gets 200 from a
#                                        residential IP with any UA.
#   nexus-shell.pages.dev         200    Pages domain, different zone, no bot
#                                        rules. Byte-identical to production.
#   github.com release assets     200
#
# Two consequences the obvious implementation gets wrong:
#
#  1. The trigger reads the manifest from nexus-shell.pages.dev, NOT from
#     nexusshell.app. Same bytes, but reachable.
#
#  2. The cask's `url` points at R2 (releases.nexusshell.app) because that is
#     fast for users, especially in mainland China — but CI cannot download it.
#     So `brew install --cask` is NOT the smoke test here; it would 403. We
#     validate the byte-identical GitHub copy instead (confirmed identical by
#     sha256), mounting it to assert the bundle version.
#
# Why the manifest and not the GitHub release as the trigger: the GitHub
# release is published BEFORE the release flow uploads the DMG to R2, so
# following it would briefly point the cask at a 404. latest.json only changes
# after the R2 upload (skill Phase 1) and the deploy (Phase 4), so
# manifest == V implies R2 already has V. It is the correct gate.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-cask
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  # Deliberately the Pages domain — the apex 403s from runners. See above.
  MANIFEST_URL: https://nexus-shell.pages.dev/releases/latest.json
  RELEASES_REPO: viewer12/Nexus-Shell-Releases
  CASK_PATH: Casks/nexus-shell.rb

jobs:
  bump:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Compare manifest against cask
        id: check
        run: |
          set -euo pipefail
          curl -fsSL "$MANIFEST_URL" -o /tmp/latest.json
          cat /tmp/latest.json

          new_version=$(jq -er .version /tmp/latest.json)
          new_sha=$(jq -r '.sha256 // empty' /tmp/latest.json)
          filename=$(jq -er .filename /tmp/latest.json)
          cur_version=$(awk -F'"' '/^  version /{print $2; exit}' "$CASK_PATH")

          echo "manifest: $new_version   cask: $cur_version"
          {
            echo "new_version=$new_version"
            echo "new_sha=$new_sha"
            echo "filename=$filename"
            echo "cur_version=$cur_version"
          } >> "$GITHUB_OUTPUT"

          if [ "$new_version" = "$cur_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard — minimum macOS still matches depends_on
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # The bot rewrites version + sha256 ONLY. `depends_on macos:` is
          # hand-maintained, because Homebrew symbols are major-version-only and
          # can't be derived from a "14.2" point release automatically. If a
          # release raises the minimum macOS major, the cask's symbol silently
          # goes stale and brew would let a too-old Mac install an app that
          # can't launch. Turn that silent failure into a loud one: block the
          # bump until a human updates `depends_on macos:` in the same change.
          min_macos=$(jq -r '.min_macos // empty' /tmp/latest.json)
          if [ -z "$min_macos" ]; then
            echo "::notice::manifest has no min_macos; skipping the depends_on guard."
            exit 0
          fi
          major="${min_macos%%.*}"
          # macOS major -> Homebrew symbol. Extend this map (and the cask) when
          # a new macOS ships. An unrecognised major fails on purpose.
          case "$major" in
            13) want="ventura"  ;;
            14) want="sonoma"   ;;
            15) want="sequoia"  ;;
            26) want="tahoe"    ;;
            *)
              echo "::error::Unrecognised macOS major '$major' (min_macos=$min_macos). Add it to the major→symbol map in bump-cask.yml and set the cask's 'depends_on macos:' to match, then re-run."
              exit 1
              ;;
          esac
          have=$(sed -n 's/^  depends_on macos: :\([a-z_]*\).*/\1/p' "$CASK_PATH")
          echo "manifest min_macos=$min_macos (major $major -> :$want)   cask declares :$have"
          if [ "$have" != "$want" ]; then
            echo "::error::Minimum macOS changed: manifest wants :$want but the cask declares :$have. Hand-edit 'depends_on macos: :$want' in $CASK_PATH in the same change, then re-run. (The bot never rewrites depends_on.)"
            exit 1
          fi

      - name: Fetch and verify the artifact
        id: artifact
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ steps.check.outputs.new_version }}'
          filename='${{ steps.check.outputs.filename }}'

          # R2 is unreachable from here, so validate the GitHub copy. It is the
          # same build; the sha256 assertions below are what make that claim
          # safe rather than assumed.
          gh release download "v${version}" --repo "$RELEASES_REPO" \
            --pattern "$filename" --dir /tmp --clobber

          actual_sha=$(shasum -a 256 "/tmp/$filename" | cut -d' ' -f1)
          echo "sha256 of GitHub artifact: $actual_sha"

          manifest_sha='${{ steps.check.outputs.new_sha }}'
          if [ -n "$manifest_sha" ] && [ "$manifest_sha" != "$actual_sha" ]; then
            echo "::error::Manifest sha256 ($manifest_sha) does not match the GitHub artifact ($actual_sha). The site and the release disagree about what shipped — refusing to bump."
            exit 1
          fi
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"

          # Mount and assert the bundle version matches the cask exactly.
          #
          # Not cosmetic: `auto_updates true` makes `brew upgrade` compare the
          # cask version against CFBundleShortVersionString, and that comparison
          # returns nil — silently meaning "not outdated" — when the two have a
          # different number of dot-separated segments. Ship a cask "1.6"
          # against a bundle "1.6.0" and every user is frozen forever with no
          # error anywhere. Asserting equality subsumes the segment check.
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmg "/tmp/$filename"
          bundle_version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \
            "/tmp/dmg/Nexus Shell.app/Contents/Info.plist")
          codesign -dv --verbose=4 "/tmp/dmg/Nexus Shell.app" 2>&1 | grep -E "Authority=Developer ID|flags=" || true
          hdiutil detach /tmp/dmg -quiet

          echo "cask: $version   bundle: $bundle_version"
          if [ "$bundle_version" != "$version" ]; then
            echo "::error::Bundle version '$bundle_version' does not match '$version'."
            exit 1
          fi

      - name: Rewrite cask
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sed -i '' -E "s|^  version \".*\"|  version \"${{ steps.check.outputs.new_version }}\"|" "$CASK_PATH"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${{ steps.artifact.outputs.sha256 }}\"|" "$CASK_PATH"
          git --no-pager diff -- "$CASK_PATH"

      - name: brew style + audit
        if: steps.check.outputs.changed == 'true'
        env:
          HOMEBREW_DEVELOPER: 1
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/viewer12"
          mkdir -p "$taps"
          ln -sfn "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew trust --tap viewer12/tap

          brew style "$CASK_PATH"
          # NOT --online: that fetches the cask's homepage and url, both of
          # which 403 from here. The artifact checks above cover what --online
          # would have told us about the download.
          brew audit --cask --strict viewer12/tap/nexus-shell

      - name: Commit
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH"
          git commit -m "nexus-shell ${{ steps.check.outputs.new_version }}

          Bumped from ${{ steps.check.outputs.cur_version }} by the scheduled
          manifest poll. sha256 cross-checked against both the release manifest
          and the artifact itself; bundle version asserted equal to the cask
          version; brew style and brew audit --strict clean."
          git push
