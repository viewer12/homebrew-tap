name: probe
on: { workflow_dispatch: }
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: What can a runner actually reach?
        run: |
          for u in \
            "https://nexusshell.app/releases/latest.json" \
            "https://nexus-shell.pages.dev/releases/latest.json" \
            "https://releases.nexusshell.app/Nexus-Shell-v1.5.10.dmg" \
            "https://github.com/viewer12/Nexus-Shell-Releases/releases/download/v1.5.10/Nexus-Shell-v1.5.10.dmg" \
            "https://updates.nexusshell.app/stable/macos/appcast.xml" ; do
            head=$(curl -sS -o /dev/null -w '%{http_code}' -I "$u" 2>/dev/null || echo 000)
            get=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-1024 "$u" 2>/dev/null || echo 000)
            printf 'HEAD=%s GET=%s  %s\n' "$head" "$get" "$u"
          done
